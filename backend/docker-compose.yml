version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: zatca_postgres
    environment:
      POSTGRES_USER: zatca
      POSTGRES_PASSWORD: zatca_password
      POSTGRES_DB: zatca_bridge
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zatca -d zatca_bridge"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zatca_network

volumes:
  postgres_data:
    driver: local

networks:
  zatca_network:
    driver: bridge
